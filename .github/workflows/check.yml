name: check

on:
  push:
  pull_request:

jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m app.check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node site/check.mjs
