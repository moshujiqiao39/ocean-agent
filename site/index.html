<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>海洋智能体</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M3 20c4 0 4-4 8-4s4 4 8 4 4-4 8-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M3 14c4 0 4-4 8-4s4 4 8 4 4-4 8-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55"/>
        </svg>
        <div>
          <strong>海洋智能体</strong>
          <p id="mode">正在读取知识…</p>
        </div>
      </div>
      <h2>已掌握的资料</h2>
      <ul id="docs"></ul>
      <p class="sync">这个网页发布在 GitHub 上。你的电脑关机后，其他电脑仍可打开。更新 <code>knowledge</code> 并推送后，网页会换成新资料。</p>
    </aside>
    <main class="chat">
      <header class="top">
        <div>
          <h1>提问</h1>
          <p>用日常说法就行。回答只依据已掌握的海洋资料。</p>
        </div>
        <button type="button" id="dev-toggle" aria-expanded="false" aria-controls="developer">开发者</button>
      </header>
      <section id="developer" aria-label="开发者">
        <form id="learn-form">
          <label>知识标题
            <input id="learn-title" name="title" required maxlength="80" placeholder="例如：海月水母">
          </label>
          <label>日常问法
            <textarea id="learn-asks" name="asks" maxlength="500" placeholder="人们可能会怎么问，用句号分开"></textarea>
          </label>
          <label>知识内容
            <textarea id="learn-body" name="body" required maxlength="8000" placeholder="写下要让智能体掌握的海洋知识"></textarea>
          </label>
          <label class="file-label">或上传文本
            <input id="learn-file" name="file" type="file" accept=".md,.txt,.markdown,text/plain">
          </label>
          <div class="dev-actions">
            <button type="submit" id="learn-submit">让智能体学习</button>
            <button type="button" id="sync-learned">同步到其他电脑</button>
          </div>
          <p id="learn-status" role="status"></p>
        </form>
        <label>GitHub 令牌
          <input id="github-token" type="password" autocomplete="off" placeholder="有仓库写入权限的令牌，只保存在这台浏览器">
        </label>
        <p class="hint">不填令牌时，新知识只在这台浏览器里生效。填入令牌后再同步，其他电脑打开网页就能用到。</p>
        <h2>新学习的知识</h2>
        <ul id="learned"></ul>
      </section>
      <div id="log" class="log" aria-live="polite">
        <div class="empty" id="empty">
          <p>可以先问这几个：</p>
          <div class="examples">
            <button type="button" data-q="海里为什么有的地方水是暖的">海里为什么有的地方水是暖的</button>
            <button type="button" data-q="海水为什么一天要涨两次">海水为什么一天要涨两次</button>
            <button type="button" data-q="珊瑚怎么突然白了">珊瑚怎么突然白了</button>
            <button type="button" data-q="鲸鱼晚上怎么找吃的">鲸鱼晚上怎么找吃的</button>
          </div>
        </div>
      </div>
      <form id="composer" class="composer">
        <label class="sr" for="question">问题</label>
        <input id="question" name="question" autocomplete="off" placeholder="例如：海边怎么鱼这么多" maxlength="2000">
        <button type="submit" id="send">发送</button>
      </form>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
